<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!-- Latest compiled and minified CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Latest compiled JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
  #target {
    border: 1px solid #ccc;
    height: 400px;
    overflow-y: auto;
    padding: 10px;
    background-color: #f9f9f9;
  }
  .message {
    padding: 8px 12px;
    margin-bottom: 8px;
    border-radius: 16px;
    max-width: 70%;
    word-wrap: break-word;
  }
  .left {
    background-color: #e0f7fa;
    text-align: left;
    align-self: flex-start;
  }
  .right {
    background-color: #ffecb3;
    text-align: right;
    align-self: flex-end;
  }
</style>
<script>
	document.addEventListener('DOMContentLoaded',function(){
		const leftTxt = document.querySelector('#leftTxt');
		const rightTxt = document.querySelector('#rightTxt');
		const target = document.querySelector('#target');
		
		function addMessage(text, side) {
			const msgDiv = document.createElement('div');
			msgDiv.classList.add('message', side);
			msgDiv.textContent = text;
			target.appendChild(msgDiv);
			target.scrollTop = target.scrollHeight; // 항상 아래로 스크롤
		}

		
		document.querySelector('#leftBtn').addEventListener('click',function(){
			/*
				1) leftTxt 공백이 아니라면
				2) target 복사
				3) leftTxt 내용 삭제
			*/
			if(leftTxt.value != ''){
				addMessage(leftTxt.value, 'left');
				leftTxt.value ='';
			}
		});
		
		document.querySelector('#rightBtn').addEventListener('click',function(){
			/*
				1) rightTxt 공백이 아니라면
				2) target 복사
				3) rightTxt 내용 삭제
			*/
			if(rightTxt.value != ''){
				addMessage(rightTxt.value, 'right');
				rightTxt.value = '';
			}
		});
	});
</script>
<title>Insert title here</title>
</head>
<body class="container mt-3">
	<div class="row">
		<!-- Left (루피) -->
		<div class="col d-flex flex-column align-items-start">
			<textarea id="leftTxt" rows="5" cols="30" class="form-control mb-2"></textarea>
			<button id="leftBtn" class="btn btn-primary">보내기 --></button>
		</div>
		
		<!-- Center (Chat) -->
		<div class="col">
			<div id="target" class="d-flex flex-column"></div>
		</div>
		
		<!-- Right (조로) -->
		<div class="col d-flex flex-column align-items-end">
			<textarea id="rightTxt" rows="5" cols="30" class="form-control mb-2"></textarea>
			<button id="rightBtn" class="btn btn-success"><-- 보내기</button>
		</div>
	</div>
</body>
</html>
