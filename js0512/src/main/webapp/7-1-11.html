<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
	h1{
		user-select: none;
	}
</style>
</head>
<body>
<script>
	// 이벤트 설정하기
	document.addEventListener('DOMContentLoaded', function(){
		let count = 0;
		const h1 = document.querySelector('h1');
		
		h1.addEventListener('click', function(){
			count++;
			h1.textContent = `클릭 횟수 : ${count}`;
		});
	});
</script>
	<h1>클릭 횟수: 0</h1>
</body>
</html>
