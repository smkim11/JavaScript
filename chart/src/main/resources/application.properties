spring.application.name=chart

# server config
server.port=80
server.servlet.context-path=/

# view config
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# db config
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/chart
spring.datasource.username=root
spring.datasource.password=java1234

# log config
logging.level.com.example.chart.controller=info
logging.level.com.example.chart.service=info
logging.level.com.example.chart.mapper=info