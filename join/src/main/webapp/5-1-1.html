<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<script>
		// 함수
	
		function hello(){ // {}안의 모든 코드(명령)들을 hello 이름으로 부르겠다 - 코드의 집합
			alert('hello');
		}
		
		hello(); // 함수 호출
		
		let bye = function (){ // 익명함수를 bye변수에 저장
					alert('bye');
				  };
		
		bye();
		
		let hello2 = hello;
		let bye2 = bye;
		
		hello2();
		bye2();
		
		(function () {console.log('하하하');})(); // 익명함수 즉시호출
		
		// f(); // 익명함수는 만들어진 후에 호출가능
		f2(); // 선언적 함수는 호출코드가 먼저 와도 호이스팅으로 호출이 가능
		
		// 즉시호출이 아닌경우에는 익명함수는 변수에 대입해서 사용
		let f = function () {console.log('하하하');};
		
		// 선언적 함수 : 호이스팅이 발생한다 - 실행전에 함수선언코드를 코드의 첫라인으로 이동시킨다.
		function f2 () {
			alert('aaa');
		};
		
		// 구조적 프로그래밍
		let am = function(){
			alert('아침먹자');
		};
		
		let pm = function(){
			alert('점심먹자');
		};
		
		const today = new Date();
		const hour = today.getHours();
		
		if(hour<12){
			am();
		}else {
			pm();
		}
		
		// 함수형 프로그래밍
		let eat = function(ampm){
			ampm();
		}
		
		let x;
		if(hour<12){
			x = am;
		}else {
			x = pm;
		}
		
		eat(x);
	</script>
</body>
</html>
