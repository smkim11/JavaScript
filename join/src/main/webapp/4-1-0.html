<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
	// javascript의 배열은 java의 List<Object>와 비슷하다

	let arr = [];
	// let arr2 = new Array();
	console.log(arr.length);
	arr[0] = '구디';
	console.log(arr.length, arr[0]);
	arr[1] = 777;
	console.log(arr.length, arr[0], arr[1]);
	console.log(arr);
	
	let arr2 = [];
	arr2.push('루피');
	arr2.push('조로');
	arr2.push('나미');
	console.log(arr2[2]); // 나미
	console.log(arr2[3]); // undefined 
	arr2.push('상디');
	arr2.push('우솝');
	arr2.push('쵸파');
	console.log(arr2);
	
	let arr3 = arr2.splice(3,2); // index 3 부터 2개 잘라서 제거
	console.log(arr2);
	console.log(arr3);
	
	console.log(arr2.indexOf('조로')); // 값이 저장되어 있는 index 위치
	
	let str = "동해물과 백두산이 마르고 닳도록"; // 문자열에도 indexOf사용 가능
	console.log(str[3]); // 과
	console.log(str.indexOf('백두산')); // 5
	
	console.log(arr2);
	arr2.filter(function(x) {console.log(x);}); // filter는 가지고있는 값 개수만큼 돌린다.
	arr2.filter((x)=>console.log(x)); // 람다함수를 arr2순환하면서 요소를 매개값으로 실행
</script>
</head>
<body>

</body>
</html>
