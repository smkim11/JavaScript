<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<script>
	let a = [];
	console.log('배열 타입:',typeof a); // object
	if(Array.isArray(a)){ // 배열인지 확인하는 메소드
		console.log('배열입니다.');
	}else{
		console.log('객체입니다.')
	}
	let b = ()=>console.log('test');
	console.log('함수 타입:',typeof b); // function
	
	let c = {};
	console.log('객체 타입:',typeof c); // object
	if(Array.isArray(c)){
		console.log('배열입니다.');
	}else{
		console.log('객체입니다.')
	}
</script>
</body>
</html>
