<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
	// 익명함수, 콜백함수, 핸들러
	document.addEventListener('DOMContentLoaded', function(){ // DOMContentLoaded 문서객체를 모두 읽고나서 실행(script를 위에 작성해도 된다)
		alert(document.querySelector('#name').value);
	});

</script>
</head>
<body>
	<input type="text" id="name" value="에이스">
</body>
</html>
