<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<script>
	class Student{
		constructor(name, age){
			this.name= name;
			this.age = age;
		}
		// 메소드는 화살표함수X
		print(){
			alert(this.name + this.age);
		}
	}
	
	let s = new Student('상디', 20); // Student() 함수 호출이 아니고, Student클래스의 constructor() 호출
	console.log(s);
	s.print();
	
	let s2 = new Student('쵸파', 7);
	s2.print();
	
	class Student2 extends Student{
		constructor(name, age, gender){
			super(name, age);
			this.gender = gender;
		}	
	}
	
	let ss = new Student2('우솦',20,'남');
	console.log(ss);
	ss.print();
</script>
</body>
</html>
