<script>
	let t1 = document.querySelectorAll('h1');
	console.log(t1);
	
	// 글자색 랜덤 무지개 색상 중복 X
	let color = ['#FF0000','#FFA200','#ffff00','#00ff00','#0090ff','#0000ff','#AB00FF'];
	
	for(let i=0;i<10000;i++){
		let num = Math.floor(Math.random()*7);
		let temp = color[0];
		color[0] = color[num];
		color[num] = temp;
	}
	
	t1.forEach(function(value, index){
		
		let r = Math.floor(Math.random()*255);
		let g = Math.floor(Math.random()*255);
		let b = Math.floor(Math.random()*255);
		
		value.textContent = '안녕하세요';
		value.style.color = color[index];
		value.style.backgroundColor = `rgb(${r},${g},${b})`;
		value.style.padding = '10px';
		value.style.textAlign='center';
		value.style.margin = '30px';
	});

</script>
